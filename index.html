  if(pointers.size!==1||!svg.contains(ev.target)||ev.button!==0)return;
  const id=selectAt(ev);
  if(id)tap={id,pointer:ev.pointerId,x:ev.clientX,y:ev.clientY,time:performance.now(),touch:ev.pointerType==='touch'};
},{passive:true});
window.addEventListener('pointermove',ev=>{
  if(tap?.pointer===ev.pointerId&&moved(ev,tap))tap=null;
},{passive:true});
window.addEventListener('pointerup',ev=>{
  const t=tap;
  const only=pointers.size===1;
  tap=null;
  pointers.delete(ev.pointerId);
  if(!t||!only||t.pointer!==ev.pointerId||moved(ev,t))return;
  const elapsed=performance.now()-t.time;
  if(t.touch?elapsed>500:elapsed>=450||selectAt(ev)!==t.id)return;
  change(t.id,!routes[t.id]);
},{passive:true});
window.addEventListener('pointercancel',ev=>{pointers.delete(ev.pointerId);tap=null;},{passive:true});window.addEventListener('blur',()=>{tap=null;pointers.clear();});
// Native panning normally sends pointercancel. A visible scroll or zoom also cancels a pending tap.
function cancelTouchTap(){if(tap?.touch)tap=null;}
window.addEventListener('scroll',cancelTouchTap,{passive:true,capture:true});
window.visualViewport?.addEventListener('resize',cancelTouchTap,{passive:true});
let answer=null;
function confirmAction(text,action,label='確認',kind=''){
  $('question').textContent=text;
  $('ok').textContent=label;
  $('ok').classList.toggle('is-select',kind==='select');
  $('ok').classList.toggle('is-clear',kind==='clear');
  answer=action;
  $('confirm').showModal();
  $('cancel').focus();
}
$('cancel').onclick=()=>{$('confirm').close();answer=null;};
$('confirm').addEventListener('cancel',()=>{answer=null;});
$('ok').onclick=()=>{const f=answer;answer=null;$('confirm').close();f?.();};
$('all').onclick=()=>confirmAction(display('map.confirm.select','選取所有路徑？'),()=>change('all',true),display('map.confirm.accept','確定'),'select');
$('clear').onclick=()=>confirmAction(display('map.confirm.clear','清除所有路徑？'),()=>change('all',false),display('map.confirm.accept','確定'),'clear');
function apply(r,op){for(const id of op.route==='all'?C.ids:[op.route])r[id]=op.value;}
function change(route,value){const op={route,value};if(admin){apply(routes,op);queue.push(op);paint();flush();}else{apply(guest,op);routes=guest;paint();notice();}}
function passwordUI(){
 $('password-group').hidden=admin;$('read-group').hidden=admin;if(admin)return;
 if(!$('copy').dataset.copyState)$('copy').textContent=display('map.copy','複製');
 const code=FengshenPassword.encode(guest);$('password').textContent=code||display('map.invalid','路線不完整');$('password').classList.toggle('invalid',!code);$('copy').disabled=!code;
}
$('input').addEventListener('input',()=>{$('input').value=$('input').value.toUpperCase();});
$('read').onclick=()=>{if(admin)return;try{const restored=FengshenPassword.decode($('input').value);guest=restored;routes=guest;paint();notice();}catch{notice(display('map.read-failed','密碼無效，請確認後再試。'));}};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter')$('read').click();});
let copyTimer,copyAttempt=0;
function showCopyResult(ok){
  const button=$('copy');
  clearTimeout(copyTimer);
  button.textContent=ok?display('map.copied','已複製'):display('map.copy-failed','請手動複製');
  button.dataset.copyState=ok?'success':'failure';
  copyTimer=setTimeout(()=>{
    button.textContent=display('map.copy','複製');
    delete button.dataset.copyState;
  },2000);
}
$('copy').onclick=async()=>{
  if(admin)return;
  const code=FengshenPassword.encode(guest);
  if(!code)return;
  const attempt=++copyAttempt;
  let copied=false;
  try{await navigator.clipboard.writeText(code);copied=true;}catch{}
  if(attempt!==copyAttempt||admin||$('password').textContent!==code)return;
  if(!copied){
    // Copy the existing visible text. No temporary input, focus change, or layout change.
    const selection=getSelection();
    if(selection){
      const range=document.createRange();
      range.selectNodeContents($('password'));
      selection.removeAllRanges();
      selection.addRange(range);
      try{copied=document.execCommand('copy')===true;}catch{}
      if(copied)selection.removeAllRanges();
    }
  }
  showCopyResult(copied);
};
const requests=new Map(),bridgeWait=[];
function googleOrigin(origin){return /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin);}
function isDescendant(root,source,depth=0){if(!root||depth>8)return false;try{if(root===source)return true;for(let i=0;i<root.length;i++)if(isDescendant(root.frames[i],source,depth+1))return true;}catch{}return false;}
function ensureBridge(){if(!$('bridge').src){if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(FengshenConfig.bridgeUrl))return Promise.reject(Error('雲端服務尚未設定'));$('bridge').src=FengshenConfig.bridgeUrl;}if(bridge)return Promise.resolve();return new Promise((resolve,reject)=>{const entry={resolve,reject};bridgeWait.push(entry);setTimeout(()=>{const i=bridgeWait.indexOf(entry);if(i>=0){bridgeWait.splice(i,1);reject(Error('雲端連線逾時'));}},20000);});}
window.addEventListener('message',async e=>{const d=e.data;if(!d||!googleOrigin(e.origin))return;
 if(d.type==='fengshen-bridge-ready'&&isDescendant($('bridge').contentWindow,e.source)){bridge={source:e.source,origin:e.origin};while(bridgeWait.length)bridgeWait.shift().resolve();return;}
 if(d.type==='fengshen-rpc-result'&&bridge&&e.source===bridge.source&&e.origin===bridge.origin){const p=requests.get(d.id);if(!p)return;requests.delete(d.id);clearTimeout(p.timer);d.error?p.reject(Error(d.error)):p.resolve(d.result);return;}
 if(d.type==='fengshen-login'&&loginAttempt&&d.nonce===loginAttempt.nonce&&isDescendant(loginAttempt.popup,e.source)&&/^[a-f0-9]{64}$/.test(d.token)){const attempt=loginAttempt;loginAttempt=null;try{await activate(d.token,attempt.epoch);if(attempt.epoch===epoch)attempt.popup.close();}catch{notice('無法讀取雲端紀錄，未覆寫任何資料。');}finally{loginBusy=false;}}
});
async function rpc(name,...args){await ensureBridge();return new Promise((resolve,reject)=>{const id=crypto.randomUUID(),timer=setTimeout(()=>{requests.delete(id);reject(Error('雲端連線逾時'));},20000);requests.set(id,{resolve,reject,timer});bridge.source.postMessage({type:'fengshen-rpc',id,method:name,args},bridge.origin);});}
function overlay(record){const r=C.clean(record);if(record.revision<revision)return;revision=record.revision;for(const op of queue)apply(r,op);routes=r;paint();}
async function flush(){if(sending||!admin||!token||!queue.length)return;const generation=epoch;sending=true;try{while(queue.length&&admin&&token&&generation===epoch){const op=queue[0],record=await rpc('updateRecord',token,op);if(generation!==epoch)return;queue.shift();overlay(record);}notice();}catch(err){if(generation!==epoch)return;notice('雲端保存失敗，尚有未保存的操作。請保持頁面開啟。');if(err.message.includes('AUTH_REQUIRED')){const expired=token;token=null;rememberSession(null);$('login').hidden=integrated;$('login').textContent='管理者重新登入';$('enabled').hidden=true;notice('登入已過期，請重新登入以保存尚未同步的操作。');if(integrated)IxSiteSession.share('expired',expired);}}finally{if(generation===epoch){sending=false;}}}
async function activate(t,generation=epoch){const record=await rpc('getRecord',t);if(generation!==epoch)return;C.clean(record);token=t;rememberSession(t);admin=true;$('login').hidden=true;$('enabled').hidden=false;$('logout').hidden=integrated;overlay(record);notice();flush();}
$('login').onclick=()=>{if(loginBusy)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(FengshenConfig.loginUrl)){notice('管理者登入尚未設定。');return;}const nonce=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join(''),popup=window.open(FengshenConfig.loginUrl+'?view=login&nonce='+nonce,'fengshen-admin-login','popup,width=520,height=650');if(!popup){notice('無法開啟 Google 登入視窗，請允許此操作後再試。');return;}loginBusy=true;loginAttempt={nonce,popup,epoch};const attempt=loginAttempt;setTimeout(()=>{if(loginAttempt===attempt){loginAttempt=null;loginBusy=false;notice('登入未完成，請重新登入。');}},300000);};
async function leave(){const old=token;rememberSession(null);++epoch;admin=false;token=null;queue=[];sending=false;revision=-1;loginAttempt=null;loginBusy=false;routes=guest;paint();$('login').hidden=false;$('login').innerHTML='<span aria-hidden="true">🔒</span> 管理者登入';$('enabled').hidden=true;$('logout').hidden=true;notice();if(old)try{await rpc('logout',old);}catch{notice('本機已登出；伺服器授權將於到期時失效。');}}
$('logout').onclick=()=>queue.length?confirmAction('仍有尚未保存的操作，確定放棄這些操作並登出？',leave):leave();
window.addEventListener('beforeunload',ev=>{if(admin&&queue.length){ev.preventDefault();ev.returnValue='';}});
paint();notice();
if(integrated){
  const session=IxSiteSession;
  let candidate=null;
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||!/^https:\/\/\d+-atari-embeds\.googleusercontent\.com$/.test(event.origin)||
       event.data?.type!=='ix-content:published')return;
    if(presentation?.apply(event.data.snapshot)){paint();resize();}
  });
  session.listen(data=>{
    if(data.type==='logout'){
      candidate=null;
      ++epoch;admin=false;token=null;queue=[];sending=false;revision=-1;routes=guest;
      $('enabled').hidden=true;
      paint();notice();
    }else if(data.type==='session'&&session.valid(data.token)&&candidate!==data.token){
      candidate=data.token;
      const generation=epoch;
      activate(candidate,generation).catch(error=>{
        if(generation!==epoch)return;
        candidate=null;
        if(error.message.includes('AUTH_REQUIRED'))session.share('expired',data.token);
        else notice('無法讀取雲端紀錄，請重新整理後再試。');
      });
    }
  });
  session.share('request');
}else restoreSession();
// Measure the card itself, so changing the iframe height cannot feed back into it.
if(window.parent!==window){
  const card=document.getElementById('fm');
  let lastHeight=0;
  new ResizeObserver(()=>{
    const height=Math.ceil(card.getBoundingClientRect().bottom)+2;
    if(height<=2||height===lastHeight)return;
    lastHeight=height;
    window.parent.postMessage({type:'fengshen-map-height',height},'*');
  }).observe(card);
}
})();
