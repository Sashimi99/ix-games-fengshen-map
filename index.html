</script><script>(function(){'use strict';

async function flush(){if(sending||!admin||!token||!queue.length)return;const generation=epoch;sending=true;try{while(queue.length&&admin&&token&&generation===epoch){const op=queue[0],record=await rpc('updateRecord',token,op);if(generation!==epoch)return;queue.shift();overlay(record);}notice();}catch(err){if(generation!==epoch)return;notice('雲端保存失敗，尚有未保存的操作。請保持頁面開啟。');if(err.message.includes('AUTH_REQUIRED')){token=null;$('login').hidden=false;$('login').textContent='管理者重新登入';$('enabled').hidden=true;notice('登入已過期，請重新登入以保存尚未同步的操作。');}}finally{if(generation===epoch){sending=false;}}}
async function activate(t,generation=epoch){const record=await rpc('getRecord',t);if(generation!==epoch)return;C.clean(record);token=t;admin=true;$('login').hidden=true;$('enabled').hidden=false;$('logout').hidden=false;overlay(record);notice();flush();}
$('login').onclick=()=>{if(loginBusy)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(FengshenConfig.loginUrl)){notice('管理者登入尚未設定。');return;}const nonce=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join(''),popup=window.open(FengshenConfig.loginUrl+'?view=login&nonce='+nonce,'fengshen-admin-login','popup,width=520,height=650');if(!popup){notice('無法開啟 Google 登入視窗，請允許此操作後再試。');return;}loginBusy=true;loginAttempt={nonce,popup,epoch};const attempt=loginAttempt;setTimeout(()=>{if(loginAttempt===attempt){loginAttempt=null;loginBusy=false;notice('登入未完成，請重新登入。');}},300000);};
async function leave(){const old=token;++epoch;admin=false;token=null;queue=[];sending=false;revision=-1;loginAttempt=null;loginBusy=false;routes=guest;paint();$('login').hidden=false;$('login').innerHTML='<span aria-hidden="true">🔒</span> 管理者登入';$('enabled').hidden=true;$('logout').hidden=true;notice();if(old)try{await rpc('logout',old);}catch{notice('本機已登出；伺服器授權將於到期時失效。');}}
$('logout').onclick=()=>queue.length?confirmAction('仍有尚未保存的操作，確定放棄這些操作並登出？',leave):leave();
window.addEventListener('beforeunload',ev=>{if(admin&&queue.length){ev.preventDefault();ev.returnValue='';}});
paint();notice();
})();
</script></body></html>
