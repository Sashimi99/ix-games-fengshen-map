button{cursor:pointer}button:disabled{cursor:default;opacity:.65}

.status{color:#526b7d;margin:12px 0;overflow-wrap:anywhere}.status.error{color:#b3261e}
.field{min-width:0;display:grid;grid-template-columns:minmax(105px,1fr) minmax(0,3fr) auto;align-items:start;gap:10px;border-top:1px solid #e5edf2;padding:10px 0}

.name{font-weight:600;overflow-wrap:anywhere}.context{color:#526b7d;font-size:12px}.unit{display:flex;gap:6px;align-items:center}

  'use strict';
  const storageKey = 'ix-games:fengshen:admin-session:v1';
  const channel = 'ix-games:admin-session:v1';
  const origin = location.origin;
  const valid = token => typeof token === 'string' && /^[a-f0-9]{64}$/.test(token);
  const googleOrigin = value => /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(value);
  const serviceUrl = value => /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(value);

  function contains(root, source, depth = 0) {
    if (!root || depth > 8) return false;
    try {
      if (root === source) return true;
      for (let i = 0; i < root.length; ++i) {
        if (contains(root.frames[i], source, depth + 1)) return true;
      }
    } catch (_) {}
    return false;
  }

  function read() {
    try {
      const value = sessionStorage.getItem(storageKey);
      return valid(value) ? value : null;
    } catch (_) { return null; }
  }

  function remember(token) {
    try {
      if (valid(token)) sessionStorage.setItem(storageKey, token);
      else sessionStorage.removeItem(storageKey);
    } catch (_) {}
  }

  function sibling(source) {
    if (parent === window) return false;
    for (let i = 0; i < parent.length; ++i) {
      if (parent.frames[i] === source && source !== window) return true;
    }
    return false;
  }

  function share(type, token = null, direct = null) {
    const message = {channel, type};
    if (valid(token)) message.token = token;
    if (direct) {

      return;
    }
    if (parent === window) return;
    for (let i = 0; i < parent.length; ++i) {
      const frame = parent.frames[i];
      if (frame !== window) frame.postMessage(message, origin);
    }
  }

    window.addEventListener('message', event => {
      if (event.origin !== origin || !sibling(event.source) || event.data?.channel !== channel) return;
      handler(event.data, event.source);

    let bridge;
    let ready;
    let acknowledge;

      if (!googleOrigin(event.origin)) return;

        bridge = {source:event.source, origin:event.origin};

        if (!request) return;
        requests.delete(data.id);
        clearTimeout(request.timer);
        if (data.error) request.reject(Error(data.error));
        else request.resolve(data.result);

      if (!serviceUrl(FengshenConfig.bridgeUrl)) throw Error('雲端服務尚未設定');
      if (!bridge) {
        if (!ready) {
          ready = new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              ready = null;
              acknowledge = null;
              reject(Error('雲端連線逾時'));
            }, 20000);
            acknowledge = () => { clearTimeout(timeout); resolve(); };
            frame.src = FengshenConfig.bridgeUrl;
          });

        await ready;
      }
      return new Promise((resolve, reject) => {
        const id = crypto.randomUUID();
        const timer = setTimeout(() => {
          requests.delete(id);
          reject(Error('雲端連線逾時'));

        requests.set(id, {resolve, reject, timer});

  function signIn() {
    if (!serviceUrl(FengshenConfig.loginUrl)) return Promise.reject(Error('管理者登入尚未設定'));
    const nonce = Array.from(crypto.getRandomValues(new Uint8Array(32)), value =>
      value.toString(16).padStart(2, '0')).join('');
    const popup = window.open(FengshenConfig.loginUrl + '?view=login&nonce=' + nonce,
      'ix-admin-login', 'popup,width=520,height=650');
    if (!popup) return Promise.reject(Error('無法開啟 Google 登入視窗'));
    return new Promise((resolve, reject) => {
      const cleanup = () => {
        window.removeEventListener('message', receive);
        clearInterval(watch);
      };
      const receive = event => {
        const data = event.data;

        popup.close();
        resolve(data.token);

      const watch = setInterval(() => {
        if (!popup.closed && Date.now() - start < 300000) return;
        cleanup();
        reject(Error('登入未完成'));
      }, 400);

    });
  }

})();

<script>(() => {
  'use strict';
  const fields = IxFieldCatalog;
  let current = {};
  const originals = new WeakMap();
  const selected = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const values = (key, fallback) => selected(current, key) ? current[key] : fallback;
  const style = new Map([
    ['bg', ['body,.ix-room-head,body>header,#guide-room,#yaiba-room', 'background-color']],
    ['title', ['.ix-room-head>h1', 'color']],
    ['subtitle', ['.ix-room-head>p', 'color']],
    ['title-desktop', ['.ix-room-head>h1', 'font-size', 'px', '(min-width:701px)']],
    ['title-mobile', ['.ix-room-head>h1', 'font-size', 'px', '(max-width:700px)']],
    ['subtitle-size', ['.ix-room-head>p', 'font-size', 'px']],
    ['text-size', ['body', 'font-size', 'px']],
    ['sidebar-bg', ['#game-drawer', 'background-color']],
    ['sidebar-ink', ['#game-drawer .room-button:not([aria-current]),#room:not([aria-current])', 'color']],
    ['sidebar-active', ['#game-drawer .room-button[aria-current=page],#room[aria-current=page]', 'color']],
    ['sidebar-spacing', ['#game-drawer .room-button', 'padding-block', 'px']],
    ['tabs-bg', ['nav.ix-subnav', 'background-color']],
    ['tabs-ink', ['nav.ix-subnav>button:not([aria-selected=true])', 'color']],
    ['tabs-active', ['nav.ix-subnav>button[aria-selected=true]', ['color','border-bottom-color']]],
    ['tabs-height', ['nav.ix-subnav>button', ['height','min-height'], 'px']],
    ['tabs-spacing', ['nav.ix-subnav', 'gap', 'px', '(min-width:701px)']],
    ['card-bg', ['.card,.guide-stage,.yb-card,.senkaiden-guide-card', 'background-color']],
    ['card-border', ['.card,.guide-stage,.yb-card,.senkaiden-guide-card', 'border-color']],
    ['card-radius', ['.card,.guide-stage,.yb-card,.senkaiden-guide-card', 'border-radius', 'px']],
    ['button-ink', ['main button:not(.primary):not(.linkbtn),.ws-actions button,.cmod-actions button,.fm-buttons button', 'color']],
    ['button-border', ['main button:not(.primary):not(.linkbtn),.ws-actions button,.cmod-actions button,.fm-buttons button', 'border-color']],
    ['button-radius', ['main button:not(.primary):not(.linkbtn),.ws-actions button,.cmod-actions button,.fm-buttons button', 'border-radius', 'px']],
    ['gutter', ['nav.ix-subnav', '--ix-subnav-gutter', 'px', '(min-width:1025px)']],
    ['head-gap', ['.ix-room-head>p', 'margin-top', 'px']],
    ['guide-width', ['.guide-main', 'max-width', 'px']],
    ['map-visited', ['.fm-route.explored', 'stroke']],
    ['map-unvisited', ['.fm-route:not(.explored)', 'stroke']],
    ['map-line-desktop', ['.fm-route', 'stroke-width', 'px', '(pointer:fine) and (min-width:601px)']],
    ['map-line-mobile', ['.fm-route', 'stroke-width', 'px', '(pointer:coarse), (max-width:600px)']],
    ['map-hit-desktop', ['.fm-hit', 'stroke-width', 'px', '(pointer:fine) and (min-width:601px)']],
    ['map-hit-mobile', ['.fm-hit', 'stroke-width', 'px', '(pointer:coarse), (max-width:600px)']],
    ['map-node', ['.fm-node', 'stroke']],
    ['map-width', ['#fm-canvas', 'max-width', 'px']],
    ['map-legend-gap', ['.fm-left', 'row-gap', 'px']],
    ['map-control-gap', ['#fm-footer', 'row-gap', 'px']],
    ['map-password-height', ['#fm-password', 'height', 'px']],
    ['map-bottom', ['#senkaiden-guide-room', 'padding-bottom', 'px', '(max-width:600px)']]
  ]);
  const extra = {
    'map-visited':['.fm-key.red','border-color'],
    'map-unvisited':['.fm-key:not(.red)','border-color'],
    'gutter':['body>header>.ix-room-head,#guide-room>.ix-room-head,#yaiba-room>.ix-room-head', 'padding-inline', 'px', '(min-width:1025px)']
  };
  function rule(value, [selector, properties, unit = '', media = null]) {
    const declarations = [].concat(properties).map(property => property + ':' + value + unit + '!important').join(';');
    const css = selector + '{' + declarations + '}';
    return media ? '@media ' + media + '{' + css + '}' : css;
  }
  function safe(key, value) {
    if (!selected(fields, key)) return false;
    const {kind, min, max} = fields[key];
    if (kind === 'color') return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);
    if (kind === 'number') return Number.isInteger(value) && value >= min && value <= max;
    if (typeof value !== 'string' || value.length < min || value.length > max) return false;
    if (kind === 'url') return /^https?:\/\/[a-z0-9.-]+(?::[0-9]+)?(?:[/?#][^\s\u0000-\u001f]*)?$/i.test(value);
    return !/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(value);
  }
  function updateStyles() {
    let sheet = document.getElementById('ix-content-style');
    if (!sheet) {
      sheet = document.createElement('style');
      sheet.id = 'ix-content-style';
      document.head.append(sheet);
    }
    const css = [];
    for (const [id, definition] of style) {
      const value = current['style.' + id];
      if (value === undefined) continue;
      css.push(rule(id === 'map-bottom' ? value + 20 : value, definition));
      if (extra[id]) css.push(rule(value, extra[id]));
    }
    if (current['style.map-password-width'] !== undefined) {
      const width = current['style.map-password-width'];
      css.push(rule(width, ['#fm-password-group', '--ix-password-width', 'px', '(min-width:601px)']));
    }
    sheet.textContent = css.join('\n');
  }
  function paint(root = document) {
    const comments = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT);
    for (let marker; (marker = comments.nextNode()); ) {
      if (!marker.data.startsWith('ix:')) continue;
      const key = marker.data.slice(3);
      const node = marker.nextSibling;
      if (node?.nodeType !== Node.TEXT_NODE || !selected(fields, key)) continue;
      if (!originals.has(node)) originals.set(node, node.data);
      const next = values(key, originals.get(node));
      if (node.data !== next) node.data = next;
    }
    for (const anchor of root.querySelectorAll('[data-ix-url]')) {
      if (!originals.has(anchor)) originals.set(anchor, anchor.getAttribute('href'));
      const next = values(anchor.dataset.ixUrl, originals.get(anchor));
      if (anchor.getAttribute('href') !== next) anchor.setAttribute('href', next);
    }
    for (const target of root.querySelectorAll('[data-ix-value]')) {
      if (!originals.has(target)) originals.set(target, target.textContent);
      const next = values(target.dataset.ixValue, originals.get(target));
      if (target.textContent !== next) target.textContent = next;
    }
  }
  function sortOptions() {
    const groups = [
      ['#ws-options','ws-order.', ['0','1','2','8','3','4','5','6','7'], row => row.dataset.ixOption],
      ['#compact-mod-tool tbody','compact-order.', ['spirit','unit','weapon','boost'], row => row.querySelector('[data-cmod-option]')?.dataset.cmodOption],
      ['#yaiba-mod-room tbody','yaiba-order.', ['ym-equipment','ym-option'], row => row.querySelector('input')?.id]
    ];
    for (const [selector,prefix,order,identify] of groups) {
      const table = document.querySelector(selector);
      if (!table || table.children.length !== order.length) continue;
      const rows = new Map(Array.from(table.children, row => [identify(row),row]));
      if (!order.every(key => rows.has(key))) continue;
      const sorted = order.slice().sort((a,b) =>
        values(prefix+a,order.indexOf(a)+1) - values(prefix+b,order.indexOf(b)+1));
      if (sorted.some((id,index) => table.children[index] !== rows.get(id))) table.append(...sorted.map(id => rows.get(id)));
    }
  }
  function guideNotes() {
    for (const container of document.querySelectorAll('[data-ix-guide]')) {
      const key = 'guide-note.' + container.dataset.ixGuide + '.';
      const lines = [1,2,3,4].map(slot => values(key + slot, '')).filter(Boolean);
