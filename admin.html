<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;color:#19354a;font:14px/1.6 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;max-width:100%}
button{cursor:pointer}button:disabled{cursor:default;opacity:.65}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#e5edf2;border-radius:6px;margin-bottom:16px}
nav button{height:44px;border:0;border-bottom:3px solid transparent;background:transparent;color:#526b7d;font-weight:600;padding:0 14px}
nav button[aria-selected=true]{color:#087e85;border-color:#087e85}
nav button:hover{background:#dbe6ed}
.card{background:white;border:1px solid #dce6ed;border-radius:12px;padding:16px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.row label{display:grid;gap:3px}
.control,.field input,.field textarea,.row input,.row select{border:1px solid #bdcfdf;border-radius:6px;padding:7px 10px;background:white}
.control{min-height:34px}.control.primary{background:#245c91;color:white;border-color:#245c91}
.status{color:#526b7d;margin:12px 0;overflow-wrap:anywhere}.status.error{color:#b3261e}
.filters{align-items:end}.filters label{min-width:0}.filters select,.filters input{min-width:0;max-width:100%;width:100%}
.filters label:nth-child(2){flex:1 1 170px}.filters label:last-of-type{flex:1 1 120px}
.save-actions{display:inline-flex;gap:8px;max-width:100%}.save-actions button{white-space:nowrap;min-height:38px}
.control.update{background:#087e85;color:white;border-color:#087e85}
.field input[type=number]{width:7ch}.unit{white-space:nowrap}
.reset-field{min-width:38px;padding-inline:6px}.reset-field svg{display:block;margin:auto;width:17px;height:17px}
.block-title{margin:12px 0 4px;padding:6px 9px;border-radius:5px;background:#e5edf2;font-size:14px}
.edit-unit{margin-block:8px;border:1px solid #dce6ed;border-radius:8px;padding:8px;min-width:0}
.edit-unit h4{margin:0}.edit-unit .row{justify-content:space-between}.edit-unit .row label{display:inline-flex;align-items:center}
.edit-unit .row .row{justify-content:flex-end}.edit-unit .field{border-top:0}
.guide-preview{border:1px solid #dce6ed;border-radius:12px;padding:14px;overflow-wrap:anywhere}
.guide-preview p{white-space:pre-wrap;margin:6px 0}.guide-preview .persuade,.guide-preview .special{border-radius:6px;padding:8px}
.guide-preview .persuade{background:#e8f3f4;color:#145f63}.guide-preview .special{background:#fff4d2;color:#59430a}
.field{min-width:0;display:grid;grid-template-columns:minmax(105px,1fr) minmax(0,3fr) auto;align-items:start;gap:10px;border-top:1px solid #e5edf2;padding:10px 0}
.field textarea{width:100%;resize:vertical;min-height:68px}.field input:not([type=color]){width:100%}.field input[type=color]{width:42px;height:35px;padding:3px}
.name{font-weight:600;overflow-wrap:anywhere}.context{color:#526b7d;font-size:12px}.unit{display:flex;gap:6px;align-items:center}
#records{margin-top:14px}.record{display:flex;align-items:center;flex-wrap:wrap;gap:8px;justify-content:space-between;border-top:1px solid #e5edf2;padding:8px 0}
@media(max-width:600px){.field{grid-template-columns:minmax(0,1fr) auto}.name{grid-column:1/-1}.card{padding:12px}nav button{padding:0 9px}.row input,.row select,.field input,.field textarea{font-size:16px}}
dialog{position:absolute;inset:auto;top:var(--confirm-top);left:50%;transform:translateX(-50%);margin:0;width:min(360px,calc(100% - 24px));border:1px solid #dce6ed;border-radius:10px;color:#19354a;padding:16px}

<div id="locked" class="status" role="status">請從左側目錄登入管理室。</div>
<div id="app" hidden>

  const storageKey = 'ix-games:fengshen:admin-session:v1';
  const channel = 'ix-games:admin-session:v1';
  const origin = location.origin;
  const valid = token => typeof token === 'string' && /^[a-f0-9]{64}$/.test(token);

  function contains(root, source, depth = 0) {

    if (parent === window) return false;

    return button;
  }
  function editUnit(title, entries, actions, refreshPreview=()=>{}) {
    const unit=make('section'); unit.className='edit-unit';
    const head=make('div'); head.className='row';
    const row=make('div'); row.className='row';
    row.append(...actions); head.append(make('h4',title),row);
    unit.append(head,...entries.map(([id,s])=>field(id,s,refreshPreview)));
    return unit;
  }
  function movement(ranks,index) {
    function move(offset) {
      const next=ranks.slice();
      [next[index],next[index+offset]]=[next[index+offset],next[index]];
      next.forEach((key,position)=>{
        if (key.startsWith('guide-order.')&&value(key)===0)
          setValue(key.replace('guide-order.','guide-hidden.'),1);
        setValue(key,position+1);
      });
      markDirty(); filter();
    }
    return [command('上移',()=>move(-1),index===0),command('下移',()=>move(1),index===ranks.length-1)];
  }
  function patchEditor(list,match) {
    const page=$('page').value;
    const ranks=optionSets[page].map(item=>orderKey(page,item)).sort((a,b)=>value(a)-value(b));
    ranks.forEach((rank,index)=>{
      const item=rank.split('.')[1];
      const entries=list.filter(([id,s])=>s.item===item && id!==rank);
      if (!entries.some(match)) return;
      $('fields').append(editUnit('改造項目 '+(index+1),entries,movement(ranks,index)));
    });
  }
  function guideEditor(list,match) {
    const stage=list.find(([,s])=>s.stage)?.[1].stage;
    if (!stage) return;
    const isStage=stage.startsWith('stage-');
    const body=list.filter(([id,s])=>!s.internal&&!s.optional&&!s.paragraph&&!id.startsWith('guide-order.'));
    const rankPrefix='guide-order.';
    const paragraphs=list.filter(([id])=>id.startsWith(rankPrefix)).map(([id,s])=>({
      rank:id, hidden:id.replace(rankPrefix,'guide-hidden.'), base:s.value,
      entries:list.filter(([,spec])=>spec.paragraph===id), optional:null
    }));
    for (let slot=1;slot<=20;slot++) {
      const suffix=stage+'.'+slot, id='guide-note.'+suffix;
      if (value(id)||newNotes.has(id)) paragraphs.push({rank:'guide-note-rank.'+suffix,hidden:'guide-note-hidden.'+suffix,
        base:40+slot,entries:[[id,specs[id]]],optional:id});
    }
    const rankOf=p=>value(p.rank)||p.base;
    const visible=p=>value(p.hidden)!==1 && value(p.rank)!==0;
    paragraphs.sort((a,b)=>rankOf(a)-rankOf(b)||a.base-b.base);
    const preview=make('div'); preview.className='guide-preview';
    function refreshPreview() {
      const display=make('h4',isStage ? [
        value('compact-guide.'+stage+'.span.1'),value('compact-guide.'+stage+'.h3.1')].filter(Boolean).join('　') :
        blockName($('room').value,editable));
      preview.replaceChildren(display);
      for (const p of paragraphs.filter(visible)) {
        const txt=p.entries.map(([id])=>value(id)).join('');
        if (!txt.trim()) continue;
        const line=make('p',txt);
        line.className=p.entries[0]?.[1].tone||'';
        preview.append(line);
      }
    }
    $('fields').append(...body.filter(match).map(([id,s])=>field(id,s,refreshPreview)));
    const ranks=paragraphs.map(p=>p.rank);
    paragraphs.forEach((item,index)=>{
      if (!item.entries.some(match)) return;
      const flag=make('input'); flag.type='checkbox'; flag.checked=visible(item);
      flag.onchange=()=>{
        // Keep a legacy hidden paragraph in its original position as it is edited.
        if (value(item.rank)===0) setValue(item.rank,item.base);
        setValue(item.hidden,flag.checked?0:1);
        markDirty(); refreshPreview();
      };
      const toggle=make('label','顯示'); toggle.prepend(flag);
      const actions=[toggle,...movement(ranks,index)];
      if (item.optional) {
        const remove=command('刪除',async()=>{
          if (value(item.optional)?.trim()&&!await ask('刪除這個補充段落？',remove))return;
          newNotes.delete(item.optional);
          for (const key of [item.optional,item.rank,item.hidden]) delete editable[key];
          markDirty(); filter();
        });
        actions.push(remove);
      }
      const base=item.entries[0]?.[1].value||'';
      const topic=item.optional?'補充段落':
        /^(地點|敵方增援|說得|特殊條件|必得道具|隨機道具|備註|第.順位)/.exec(base.trim())?.[0] ||
        (item.entries[0]?.[1].tone==='persuade'?'說得補充':'攻略段落');
      const fields=item.entries.map(([id,s])=>[id,{...s,label:'段落文字'}]);
      $('fields').append(editUnit('第 '+(index+1)+' 段・'+topic, fields,actions,refreshPreview));
    });
    const next=Array.from({length:20},(_,i)=>'guide-note.'+stage+'.'+(i+1))
      .find(id=>specs[id]&&!value(id)&&!newNotes.has(id));
    $('fields').append(command('＋ 新增段落',()=>{
      newNotes.add(next); $('search').value=''; filter(); $('edit-'+next)?.focus({preventScroll:true});
    },!next));
    if (isStage) {
      const heading=make('h3','公開網站內容預覽'); heading.className='block-title';
      refreshPreview(); $('fields').append(heading,preview);
    }
  }
  function fillChoices(restore) {
    const available = catalog.filter(([,spec])=>spec.group===tab && !spec.internal);
    if (restore) {
      const old=selections.get(tab);
      $('page').replaceChildren(...Object.entries(pages).filter(([page])=>available.some(([,s])=>s.page===page))
        .map(([id,name])=>new Option(name,id)));
      if (old && [...$('page').options].some(o=>o.value===old.page)) $('page').value=old.page;
      $('search').value=old?.query || '';
    }
    const blocks=[...new Set(available.filter(([,s])=>s.page===$('page').value).map(([,s])=>s.block))];
    const previous=restore?selections.get(tab)?.room:$('room').value;
    $('room').replaceChildren(...blocks.map(block=>new Option(blockName(block,editable),block)));
    if (blocks.includes(previous)) $('room').value=previous;
  }
  function filter(rebuild=false) {
    if (rebuild) fillChoices(true);
    selections.set(tab,{page:$('page').value,room:$('room').value,query:$('search').value});
    const list=selectedEntries();
    const query = $('search').value.trim().toLocaleLowerCase();
    const match=([id,s])=>!query || [s.label,value(id)].some(x=>String(x??'').toLocaleLowerCase().includes(query));
    const section=make('h3',blockName($('room').value,editable));section.className='block-title';
    $('fields').replaceChildren(section);
    if ($('room').value==='改造項目') patchEditor(list,match);
    else if (tab==='guide'&&list.some(([,s])=>s.stage)) guideEditor(list,match);
    else $('fields').append(...list.filter(entry=>!entry[1].internal&&match(entry)).map(([id,s])=>field(id,s)));
    if ($('fields').children.length===1) $('fields').append(make('p','這個區塊沒有符合的欄位。'));
    controls();
  }
  function paint(rebuild = false) {
    const publishing = tab === 'publish';
    $('filters').hidden = $('fields').hidden = publishing;
    $('publication').hidden = !publishing;
    document.querySelectorAll('[data-tab]').forEach(button => button.setAttribute('aria-selected',String(button.dataset.tab === tab)));
    if (publishing) {
      const date = state.publishedAt ? new Date(state.publishedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}) : '初始版本';
      $('live').textContent = '正式版本 ' + state.version + ' · ' + date + (state.hasDraft ? ' · 有草稿' : '');
      $('records').replaceChildren(make('h3','備份紀錄'));
      for (const backup of state.backups) {
        const line = make('div'); line.className='record';
        const name = make('span','版本 ' + backup.version + ' · ' + new Date(backup.savedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}));
        const restore = make('button','還原'); restore.type='button'; restore.className='control';
        restore.onclick = async () => {
          if (await ask('還原這個備份並發布？', restore)) execute('restore', backup.backupId);
        };
        line.append(name,restore);
        $('records').append(line);
      }
    } else filter(rebuild);
    markDirty();
  }
  async function execute(operation, payload = null) {
    if (busy || !state || !token) return;
    const attempt = generation;
    if (reloadState) return;
    const sent = {...editable};
    busy = true; controls();
    $('fields').inert = true;
    status(operation==='update'?'更新中…':'處理中……');
    try {
      const updated = await rpc('changeSiteContent', token, state.revision, operation, payload);
      if (attempt !== generation) return;
      state = updated;
      editable = operation==='update' ? sent : {...state.values};
      if (tab==='publish') paint();
      else markDirty();
      status({save:'草稿已儲存，尚未發布。',update:'已儲存並更新',discard:'已放棄草稿。',publish:'發布完成。',backup:'備份完成。',restore:'已還原並發布。'}[operation]);
      if (['publish','restore','update'].includes(operation)) session.share('published');
    } catch (error) {
      if (attempt !== generation) return;
      if (error.message === 'AUTH_REQUIRED') {
        suspended=Object.fromEntries([...new Set([...Object.keys(sent),...Object.keys(state.values)])]
          .filter(key=>sent[key]!==state.values[key]).map(key=>[key,{before:state.values[key],after:sent[key]}]));
        status('登入已失效。輸入仍在本頁，請重新登入後再試。',true);
        session.share('expired',token);
      } else {
        if (error.message==='草稿已儲存，但正式版本更新失敗' || error.message.includes('逾時')) {
          try { state=await rpc('getSiteDraft', token); if(attempt!==generation)return; markDirty(); }
          catch (_) { reloadState=true; }
        }
        status(error.message, true);
      }
    } finally {
      if (attempt === generation) { busy = false; $('fields').inert=false; controls(); }
    }
  }
  function lock() {
    if (confirmation.open) confirmation.close('cancel');
    ++generation;
    token = null; state = null; editable = {}; busy = false; dirty = false;
    $('fields').inert=false;
    reloadState=false;
    $('app').hidden = true;
    $('locked').hidden = false;
    $('locked').textContent = '請從左側目錄登入管理室。';
    $('fields').replaceChildren();
    $('records').replaceChildren();
    send('ix-admin:dirty',{dirty:false});
  }
  async function activate(candidate) {
    if (!session.valid(candidate) || candidate === token) return;
    token = candidate;
    const attempt = ++generation;
    try {
      const draft = await rpc('getSiteDraft', candidate);
      if (generation !== attempt) return;
      state = draft;
      editable = {...state.values};
      let conflict=false;
      if (suspended) {
        for (const [key,v] of Object.entries(suspended)) {
          if (state.values[key]!==v.before && state.values[key]!==v.after) conflict=true;
          if (v.after===undefined) delete editable[key];
          else editable[key]=v.after;
        }
        suspended=null;
      }
      $('locked').hidden = true;
      $('app').hidden = false;
      paint(true);
      if (conflict) status('登入期間有其他分頁更動草稿。已保留這頁的輸入，請確認後再儲存。',true);
    } catch (error) {
      if (generation !== attempt) return;
      lock();
      if (error.message === 'AUTH_REQUIRED') session.share('expired',candidate);
      else $('locked').textContent = error.message;
    }
  }
  session.listen(data => {
    if (data.type === 'session') activate(data.token);
    if (data.type === 'logout') lock();
  });
  window.addEventListener('message', event => {
    if (event.source !== parent || !parentPattern.test(event.origin) || event.data?.type !== 'ix-admin:hello') return;
    origin = event.origin;
    session.share('request');
  });
  new ResizeObserver(() => send('ix-admin:height',{height:Math.ceil(document.body.getBoundingClientRect().height)+2})).observe(document.body);
  window.addEventListener('beforeunload', event => {
    if (dirty) { event.preventDefault(); event.returnValue = ''; }
  });
  $('save').onclick = () => execute('save', editable);
  $('update').onclick = () => execute('update',scopedChanges());
  $('publish').onclick = async () => { if (await ask('發布目前草稿？', $('publish'))) execute('publish'); };
  $('discard').onclick = async () => { if (await ask('放棄尚未發布的草稿與本次未儲存修改？', $('discard'))) execute('discard'); };
  $('backup').onclick = () => execute('backup');
  $('page').onchange = () => { fillChoices(false); filter(); };
  $('room').onchange = () => filter();
  $('search').oninput = () => filter();
  document.querySelector('nav').onclick = event => {
    const button = event.target.closest('[data-tab]');
    if (!button || !state) return;
    tab = button.dataset.tab;
    paint(true);
  };
})();
</script></body></html>
